  enabled: false
  paths:
    - "/path/to/gaviota"
  max_pieces: 5

opening_books:
  enabled: true
  priority: 900
  books:
    standard_black:
      selection: weighted_random
      names:
        - Stay
        - Win
        - Black
    standard_white:
