online_moves:
  opening_explorer:
    enabled: false
    priority: 300
    only_without_book: false
    use_for_variants: true
    min_time: 20
    timeout: 5
    min_games: 10
    only_with_wins: true
    selection: "win_rate"
    anti: true

  lichess_cloud:
    enabled: true
    priority: 200
    only_without_book: true
    min_eval_depth: 20
    min_time: 15
    timeout: 3

  chessdb:
    enabled: false
    priority: 100
    only_without_book: false
    min_candidates: 5
    min_time: 20
    timeout: 5
    selection: "best"
    max_depth: 30

  online_egtb:
    enabled: true
    min_time: 5
    timeout: 3

